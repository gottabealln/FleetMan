services:
  - type: web
    name: FleetMan
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate && python manage.py createsuperuser --noinput
    startCommand: gunicorn core.wsgi:application
    envVars:
      - key: DJANGO_SUPERUSER_USERNAME
        value: admin
      - key: DJANGO_SUPERUSER_EMAIL
        value: allenprasoon@gmail.com
      - key: DJANGO_SUPERUSER_PASSWORD
        value: YourStrongPassword123!
      - key: DATABASE_URL
        fromDatabase:
          name: fleetman-db
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.12.3
